services:
  api:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on: []
    restart: unless-stopped

  # lhx:db-services
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: koa-svc-smoke
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  # (db-pg / db-mysql features append here)

  # lhx:cache-services
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped
  # (cache-redis feature appends here)

volumes:
  postgres_data:

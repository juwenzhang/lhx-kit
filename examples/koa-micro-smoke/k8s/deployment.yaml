apiVersion: apps/v1
kind: Deployment
metadata:
  name: koa-micro-smoke
  labels:
    app: koa-micro-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: koa-micro-smoke
  template:
    metadata:
      labels:
        app: koa-micro-smoke
    spec:
      containers:
        - name: koa-micro-smoke
          image: koa-micro-smoke:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /livez
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

name: 🤖 AI Summarize Long Thread

# 给任何 issue / PR 打上 `ai-summary` 标签，即触发一次 TL;DR 总结。
# 用法场景：讨论串特别长（>20 条评论）看不过来，打个标签让 AI 做 TL;DR。
#
# 设计：
#   - 只在标签为 `ai-summary` 时跑，其他标签事件跳过
#   - 跑完自动摘掉 `ai-summary` 标签（避免无限循环 / 表达"已处理"）
#   - 如果之前已有一条 AI 总结评论，删掉旧的再发新的（保持 issue 清爽）

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write
  models: read

concurrency:
  group: ai-summarize-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summarize:
    name: Summarize thread
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.label.name == 'ai-summary'

    steps:
      - name: Collect thread content
        id: gather
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number
              || context.payload.pull_request?.number;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            // 排除 AI 自己发的评论（防污染上下文）
            const realComments = comments.filter(c =>
              !(c.body || '').includes('🤖 This') &&
              !(c.body || '').includes('🤖 AI')
            );

            const thread = [
              `[Title] ${issue.title}`,
              `[Opened by @${issue.user.login}]`,
              issue.body || '(empty body)',
              ...realComments.map(c => `\n[@${c.user.login}] ${c.body}`),
            ].join('\n\n');

            core.setOutput('thread', thread);
            core.setOutput('count', realComments.length);

      - name: Call GitHub Models for summary
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          system-prompt: |
            You are a summarization assistant. Produce a concise TL;DR of the
            given GitHub issue/PR thread, structured as Markdown:

            **📋 Summary:** one sentence capturing the core topic.

            **🗣️ Key points discussed:**
            - bullet
            - bullet (max 5)

            **✅ Decisions / agreements reached** (if any):
            - bullet

            **❓ Still open / unclear:**
            - bullet

            **➡️ Suggested next step:** one sentence.

            Rules:
            - Reply in the thread's dominant language (Chinese if most comments are
              Chinese, else English).
            - Do NOT invent facts; if a section has no content, write "—".
            - Refer to participants by @username when attributing opinions.
            - Keep total length under 250 words.
          prompt: |
            Summarize the following thread:

            ${{ steps.gather.outputs.thread }}
          max-tokens: 800

      - name: Remove old AI summaries and post new one
        uses: actions/github-script@v7
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
        with:
          script: |
            const issueNumber = context.payload.issue?.number
              || context.payload.pull_request?.number;

            // 1. 清理旧的 AI 总结评论
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            for (const c of comments) {
              if ((c.body || '').includes('<!-- ai-summary-marker -->')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
                core.info(`Deleted old summary comment #${c.id}`);
              }
            }

            // 2. 发新总结（用 HTML 注释做 marker，下次好识别删除）
            const body = [
              '<!-- ai-summary-marker -->',
              process.env.AI_RESPONSE || '(no response)',
              '',
              '---',
              '<sub>🤖 Summary generated by AI. Remove the ' +
              '`ai-summary` label then re-add it to refresh.</sub>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

            // 3. 移除标签（表示"已处理"，同时允许用户再次打上来刷新）
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'ai-summary',
              });
            } catch (err) {
              core.warning(`Could not remove label: ${err.message}`);
            }

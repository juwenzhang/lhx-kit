name: 🤖 AI PR Review (DeepSeek reasoning)

# Third AI PR reviewer — runs alongside ai-review-gpt and ai-review-llama.
# Each reviewer has a DELIBERATELY DIFFERENT lens so the three comments
# complement rather than duplicate each other:
#
#   - GPT-4o   → generalist correctness / security / breaking changes
#   - Llama    → cross-file / architecture / docs / naming
#   - DeepSeek → step-by-step reasoning, edge cases, testability (THIS FILE)
#
# Model: deepseek/deepseek-v3-0324 — DeepSeek's reasoning-leaning model on
# GitHub Models. It tends to produce more "if X then Y" style walkthroughs,
# which is the strongest angle for catching boundary bugs that fast skim
# reviewers miss.
#
# Having three independent voices lets humans use AGREEMENT as a confidence
# signal and DISAGREEMENT as a "worth a second look" signal.
#
# Free on public repos via GitHub Models.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: ai-review-deepseek-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: DeepSeek review
    runs-on: ubuntu-latest
    timeout-minutes: 6
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      !contains(fromJSON('["NONE", "FIRST_TIME_CONTRIBUTOR"]'),
                github.event.pull_request.author_association)

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Collect PR diff
        id: diff
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const {data: files} = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const IGNORE = [
              /^pnpm-lock\.yaml$/,
              /^package-lock\.json$/,
              /^yarn\.lock$/,
              /\/dist\//,
              /\/doc_build\//,
              /\.min\.js$/,
              /\.map$/,
            ];
            const filtered = files.filter(f =>
              !IGNORE.some(rx => rx.test(f.filename))
            );

            const MAX_DIFF_BYTES = 150 * 1024;
            let diff = '';
            for (const f of filtered) {
              if (!f.patch) continue;
              const chunk = `\n\n--- ${f.filename} ---\n${f.patch}`;
              if (diff.length + chunk.length > MAX_DIFF_BYTES) {
                diff += `\n\n[… truncated. ${filtered.length - filtered.indexOf(f)} files omitted. …]`;
                break;
              }
              diff += chunk;
            }

            core.setOutput('diff', diff);
            core.setOutput('file_count', filtered.length);
            core.setOutput('pr_title', pr.title);
            core.setOutput('pr_body', pr.body || '(empty)');

      - name: Call DeepSeek for reasoning-focused review
        id: ai
        uses: actions/ai-inference@v1
        with:
          # DeepSeek V3 0324 is the publicly available V3 checkpoint via
          # GitHub Models. Its sweet spot is "reason through edge cases
          # step by step", which is why we use it for the boundary-bug lens.
          model: deepseek/deepseek-v3-0324
          system-prompt: |
            You are the THIRD reviewer on this PR, specializing in RIGOROUS
            REASONING about edge cases and testability. Two other AI
            reviewers (GPT and Llama) already cover correctness, security,
            architecture, and docs. DO NOT repeat what they would say.

            Your output is one Markdown comment with these sections
            (keep headings exactly; write "—" when a section has nothing):

            ## 🧠 Edge cases & invariants

            For the new/changed code, think adversarially:
            - What are the INPUT BOUNDARIES (null / empty / huge / wrong type / NaN)?
            - What IMPLICIT INVARIANTS can a future caller accidentally break?
            - Any RACE CONDITIONS / re-entrancy / iteration-during-mutation risks?
            - Any SILENT FAILURE modes (try/catch swallows, missing `await`, etc.)?

            ## 🧪 Test coverage gaps

            Look at what this diff changes and name the SMALLEST set of
            unit tests that would have caught a regression. Reference file
            paths where tests should live (e.g. `packages/runtime/tests/...`).

            ## 🔢 Algorithmic / correctness concerns

            Any off-by-one, incorrect comparator, wrong early-exit, misuse
            of `Array.prototype.*` that skips holes, etc.? Show the minimal
            repro input if you can.

            ## 🤝 Agreement check with other reviewers

            - If your finding REINFORCES something GPT/Llama likely said → mark "(confirms other reviewer)"
            - If your finding would CONTRADICT a plausible other take → mark "(possible divergence — human arbitrate)"

            Rules:
            - Reply in the language of the PR title.
            - Be concrete; reference filenames and line ranges.
            - Explain your reasoning ONE STEP AT A TIME; don't just declare verdicts.
            - Don't invent facts; say "cannot tell from diff alone" if unsure.
            - Never claim to have made changes.
            - End with: `— 🤖 DeepSeek V3 reasoning lens via GitHub Models`
          prompt: |
            # PR under review

            **Title**: ${{ steps.diff.outputs.pr_title }}
            **Total scope**: ${{ steps.diff.outputs.file_count }} files changed

            **Description**:
            ${{ steps.diff.outputs.pr_body }}

            **Diff**:
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

            Now produce the reasoning-focused review per the system prompt.
            Walk through the logic; don't just spot-check.
          max-tokens: 2000

      - name: Post / update DeepSeek review comment
        uses: actions/github-script@v7
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
        with:
          script: |
            const MARKER = '<!-- ai-review-deepseek-marker -->';
            const body = [
              MARKER,
              process.env.AI_RESPONSE || '_(no response)_',
              '',
              '<sub>🤖 Posted by `ai-review-deepseek.yaml` (DeepSeek V3). The third voice — trio with GPT-4o and Llama 3.3. Use cross-model agreement as a confidence signal.</sub>',
            ].join('\n');

            const {data: existing} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const prior = existing.find(c => (c.body || '').includes(MARKER));
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

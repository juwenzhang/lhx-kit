name: CI

# Path filters: only run CI when something it actually validates has
# changed. Docs-only pushes (apps/docs/**) or README tweaks skip CI
# entirely, saving several minutes per push.
#
# Notes:
#   - Root configs (biome.json, tsconfig.base.json, pnpm-*.yaml, root
#     package.json, lint-staged/commitlint config) affect every package,
#     so they MUST be listed.
#   - The workflow file itself is listed so iterations on ci.yaml run
#     immediately rather than requiring an unrelated code change.
#   - `paths-ignore` is deliberately NOT used — it silently passes when
#     a push touches both listed AND unlisted paths, leading to false
#     greens. Explicit `paths` allow-list is safer.
on:
  push:
    branches: [master, main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'biome.json'
      - 'commitlint.config.cjs'
      - 'lint-staged.config.cjs'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [master, main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'biome.json'
      - 'commitlint.config.cjs'
      - 'lint-staged.config.cjs'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:

# 同一 PR 后续 push 会 cancel 前一次跑（节省算力）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 给 CI 最小权限
permissions:
  contents: read

env:
  # pnpm version is read from root package.json "packageManager"
  # (do NOT also pass `version:` to pnpm/action-setup — it errors out).
  NODE_VERSION: 22

jobs:
  # ──────────────────────────────────────────────────────
  # Lint / Format 检查
  # ──────────────────────────────────────────────────────
  lint:
    name: 🎨 Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        # CI 必须严格 frozen：让 lockfile 成为唯一事实来源。
        # 前提是 `package.json#pnpm.supportedArchitectures` 已声明所有
        # 目标平台（见根 package.json），保证 lockfile 包含 linux-x64 的
        # 原生二进制（biome、esbuild、swc 等）。2026-05-02 的 Release
        # workflow 崩溃就是因为 lockfile 漏了 @biomejs/cli-linux-x64。
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm exec biome check .

  # ──────────────────────────────────────────────────────
  # Commit Message 规范检查
  # ──────────────────────────────────────────────────────
  commitlint:
    name: 📝 Commit Lint
    runs-on: ubuntu-latest
    # 仅 PR 场景检查整段 commits
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate commits
        run: |
          pnpm exec commitlint \
            --from=${{ github.event.pull_request.base.sha }} \
            --to=${{ github.event.pull_request.head.sha }} \
            --verbose

  # ──────────────────────────────────────────────────────
  # TypeScript 类型检查 + 构建
  # ──────────────────────────────────────────────────────
  typecheck-build:
    name: 🔧 Typecheck & Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # examples/* 的 engines.node 要求 >= 20；tsdown 构建需要 Node >= 22.18。
        # packages/* 运行时兼容更老的 Node，如需验证可以单独加一个 job。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        # 必须先把 packages/cli 等内部包的 dist 产出，下面的 examples
        # 脚本才能找到 `lhx-cli` 这个 bin。
        run: pnpm --filter './packages/*' --if-present build

      - name: Rebuild pnpm bin shims
        # 关键：packages/cli 的 bin 指向 dist/bin.js。install 时 dist 还
        # 不存在，pnpm 虽然建了 .bin/lhx-cli 的 symlink 但目标文件不存
        # 在；build 产出 dist 后不会自动重建 shim。这里显式 rebuild 一
        # 下，让 examples/* 里的 `lhx-cli build` 能找到可执行文件。
        #
        # 为什么不是 `pnpm install --offline`？那个在 pnpm 9 下不会重
        # 新处理 workspace 内部包的 bin symlink，导致 examples/vmpa 里
        # `lhx-cli: command not found`（Exit 127）。必须重新跑完整的
        # install 让 pnpm 重新建 .bin/ 链接。lockfile 已经 frozen，
        # --prefer-offline 保证不走网络。
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck packages
        # Only typecheck packages/* — they are the release contract and
        # must stay clean. examples/* declare typecheck scripts of their
        # own (tsc / vue-tsc) for local smoke-testing, but they are
        # NOT a publishing gate: their TS errors must not block a
        # package release. Including them here was the source of two
        # previous false-positive CI reds when experimental code landed
        # under examples/ before packages/* was ready for it.
        run: pnpm -r --if-present --parallel --filter='./packages/*' typecheck

  # ──────────────────────────────────────────────────────
  # 跨平台兼容性（Ubuntu / macOS / Windows 上 packages/* 能否构建）
  # ──────────────────────────────────────────────────────
  cross-platform:
    name: 🌐 Cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@lhx-kit/*' build

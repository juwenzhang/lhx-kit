name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [master, main]
    # Trigger only when something that actually shows up on the docs
    # site changes. Rationale:
    #   - apps/docs/**            → the docs source itself
    #   - .github/workflows/...   → iterating on the deploy pipeline
    #   - pnpm-lock.yaml          → dep graph change may affect Rspress
    #     build output (new minor of rspress etc.)
    #
    # Deliberately NOT listed:
    #   - packages/**             → docs site imports nothing from them
    #     at build time; CI workflow already covers package changes.
    #   - root package.json       → scripts/deps change handled via
    #     pnpm-lock.yaml above.
    paths:
      - 'apps/docs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/rspress-docs-ci-cd.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 发版并发不允许重叠（避免 Pages 部署互相覆盖）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 📚 Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 若 lastUpdated 启用需要完整 git log
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version is read from root package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Pages
        # Pages MUST already be enabled with "Source: GitHub Actions"
        # under Settings → Pages. The `enablement: true` input cannot
        # be used here: it requires a PAT with `administration:write`,
        # and the default GITHUB_TOKEN doesn't have that permission.
        # If this step fails with 'Get Pages site failed', the fix is
        # to switch the source to "GitHub Actions" in the UI once.
        uses: actions/configure-pages@v6

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build docs with Rspress
        # Rspress consumes pure markdown + its own components. It does
        # NOT import anything from packages/*, so there's no need to
        # build the internal packages here (that's what the CI workflow
        # is for). Dropping the `pnpm --filter './packages/*' build`
        # step shaved ~90s off the typical docs deploy.
        run: pnpm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/doc_build

  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

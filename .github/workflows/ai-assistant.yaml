name: 🤖 AI Assistant

# issue / PR 评论里 @mention "ai-bot" 即可触发 AI 回答。
#
# 用法：
#   @ai-bot 这个 offline 包的 hashConcurrency 默认是多少？能改吗？
#   @ai-bot 帮我解释下 vite-plugin 里 renameBundleEntry 为什么要 in-place 改 fileName
#
# workflow 会：
#   1. 过滤出 body 以 "@ai-bot " 开头的评论
#   2. 拉 issue/PR 的 title + body + 最近 5 条评论做上下文
#   3. 读项目 README + 相关文件做仓库上下文
#   4. 调 GitHub Models（默认 gpt-4o-mini，可按需切 claude）
#   5. 回复评论
#
# 不改代码，只回答。想让 AI 改代码请用 claude-code-action 方案（文档另述）。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write         # 发评论需要
  pull-requests: write  # PR 评论也要能回
  models: read

concurrency:
  # 每个 issue 一组，避免用户快速连发 @mention 互相覆盖
  group: ai-assistant-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    name: Answer @ai-bot mention
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # 精准触发条件：
    #   - 必须是 @ai-bot 起首的评论（大小写不敏感）
    #   - 排除 `@ai-bot fix ` —— 那是 ai-code-fix.yaml 的专用指令，不是问答
    #   - 排除机器人自己的评论（防止和 ai-triage 的评论互相呼唤死循环）
    #   - 排除 PR review body（那个用 pull_request_review 事件，本 workflow 不处理）
    if: >-
      startsWith(github.event.comment.body, '@ai-bot ') &&
      !startsWith(github.event.comment.body, '@ai-bot fix ') &&
      github.event.comment.user.type != 'Bot' &&
      !contains(github.event.comment.body, '🤖 This comment was generated by AI')

    steps:
      - name: React to the mention (👀)
        # 先给评论打个 👀，让用户知道 workflow 收到了，避免以为没触发
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Checkout (for repo context)
        uses: actions/checkout@v6
        with:
          # 只拉关键文件做 prompt 上下文，不 checkout 全部（快）
          sparse-checkout: |
            README.md
            README.zh-CN.md
            packages/*/README.md
            apps/docs/docs
          sparse-checkout-cone-mode: false

      - name: Gather issue context
        id: context
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = context.payload.issue?.number
              || context.payload.pull_request?.number;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            // 取最近 5 条评论（排除当前触发评论，避免重复）
            const triggerId = context.payload.comment.id;
            const recent = comments
              .filter(c => c.id !== triggerId)
              .slice(-5)
              .map(c => `[@${c.user.login}] ${c.body}`)
              .join('\n\n');

            // 当前触发评论去掉 @ai-bot 前缀
            const question = context.payload.comment.body
              .replace(/^@ai-bot\s+/i, '')
              .trim();

            core.setOutput('question', question);
            core.setOutput('issue_title', issue.title);
            core.setOutput('issue_body', issue.body || '');
            core.setOutput('recent_comments', recent);
            core.setOutput('asker', context.payload.comment.user.login);

      - name: Read project README for context
        id: readme
        run: |
          if [ -f README.md ]; then
            # 只取前 100 行避免 prompt 过长
            head -n 100 README.md > /tmp/readme.txt
            echo "content<<EOF" >> "$GITHUB_OUTPUT"
            cat /tmp/readme.txt >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Call GitHub Models
        id: ai
        uses: actions/ai-inference@v2
        with:
          model: openai/gpt-4o-mini
          system-prompt: |
            You are a helpful assistant embedded in the lhx-kit GitHub repo.
            lhx-kit is a monorepo for MPA scaffolding with:
              - @lhx-kit/cli           (command-line scaffold: create/add/dev/build)
              - @lhx-kit/runtime       (config-driven renderer + Vite plugin utilities)
              - @lhx-kit/vite-plugin   (Vite plugin: CDN, hash rename, chunk reporting)
              - @lhx-kit/offline       (offline package: hash, brotli, inspect)
              - @lhx-kit/renderer      (config-driven component renderer)
              - @lhx-kit/config, @lhx-kit/skills, @lhx-kit/tsconfig

            Guidelines:
            - Answer the user's question concisely (aim for <= 300 words).
            - If you don't know, say so honestly; don't fabricate API signatures.
            - Use the issue context AND the README excerpt provided to ground your answer.
            - Use Markdown formatting (code blocks for code, bullet lists where helpful).
            - Reply in the SAME language as the user's question
              (Chinese question → Chinese answer).
            - When referencing files, use backticks (e.g. `packages/cli/src/bin.ts`).
            - Never claim to have made code changes — you only answer questions.
            - If the question asks you to change code, kindly redirect: suggest the user
              open a PR or ping a maintainer.
          prompt: |
            ## Repository README (truncated)
            ${{ steps.readme.outputs.content }}

            ## Current issue
            Title: ${{ steps.context.outputs.issue_title }}

            Body:
            ${{ steps.context.outputs.issue_body }}

            ## Recent comments (latest 5)
            ${{ steps.context.outputs.recent_comments }}

            ## The actual question from @${{ steps.context.outputs.asker }}
            ${{ steps.context.outputs.question }}
          max-tokens: 1200

      - name: Reply in the issue
        uses: actions/github-script@v9
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
          ASKER: ${{ steps.context.outputs.asker }}
        with:
          script: |
            const response = process.env.AI_RESPONSE || '(no response)';
            const asker = process.env.ASKER;
            const issueNumber = context.payload.issue?.number
              || context.payload.pull_request?.number;

            const body = [
              `@${asker} 👋`,
              '',
              response,
              '',
              '---',
              '<sub>🤖 This reply was generated by AI. Answers may be inaccurate — ' +
              'please verify before acting on technical advice.</sub>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

            // 把 👀 换成 ✅ 表示处理完成
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1',
            });

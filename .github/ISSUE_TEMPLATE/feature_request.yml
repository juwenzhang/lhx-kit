name: ✨ 功能请求
description: 建议新功能或改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的痛点 / 使用场景
      placeholder: 我在 xxx 场景下发现 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望这个功能怎么工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有 workaround？为什么不够？

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - '@lhx-kit/config'
        - '@lhx-kit/cli'
        - '@lhx-kit/runtime'
        - '@lhx-kit/renderer'
        - '@lhx-kit/offline'
        - '@lhx-kit/vite-plugin'
        - 模板
        - 文档
        - 工程化 / CI
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 其他上下文
